<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurações - Castro Materiais</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <img src="img/logo.png" alt="Logo Castro Materiais">
            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>

                <li>
                    <a href="material.html">
                        <i class="fas fa-box"></i> Materiais
                    </a>
                </li>

                <li>
                    <a href="cliente.html">
                        <i class="fas fa-users"></i> Clientes
                    </a>
                </li>

                <li>
                    <a href="pedidos.html">
                        <i class="fas fa-cart-shopping"></i> Pedidos
                    </a>
                </li>

                <li>
                    <a href="pagamentos.html">
                        <i class="fas fa-money-bill"></i> Pagamentos
                    </a>
                </li>

                <li>
                    <a href="relatorios.html">
                        <i class="fas fa-chart-column"></i> Relatórios
                    </a>
                </li>

                <li class="active">
                    <a href="configuracao.html">
                        <i class="fas fa-gear"></i> Configurações
                    </a>
                </li>

                <li>
                    <a href="perfil.html">
                        <i class="fas fa-user"></i> Perfil
                    </a>
                </li>

            </ul>

        </aside>

        <main class="content">

            <h1>Configurações</h1>

            <div class="form-box">

                <div class="form-box">

                    <div class="form-group">
                        <label>Nome da Empresa</label>
                        <input type="text" id="input-empresa" value="Castro Materiais">
                    </div>

                    <div class="form-group">
                        <label>CNPJ</label>
                        <input type="text" id="input-cnpj" value="00.000.000/0001-00">
                    </div>

                    <div class="form-group">
                        <label>E-mail</label>
                        <input type="email" id="input-email" value="contato@castromateriais.com">
                    </div>

                    <div class="form-group">
                        <label>Telefone</label>
                        <input type="text" id="input-telefone" value="(77) 99999-9999">
                    </div>

                    <div class="form-group">
                        <label>Endereço</label>
                        <input type="text" value="Brasília - DF">
                    </div>

                  

                    <div class="buttons">
                        <button type="button" id="btn-salvar" class="btn-save">
                            <i class="fas fa-check"></i> Salvar Configurações
                        </button>
                    </div>

                </div>

            </div>

        </main>

    </div>
    <script>

        const btnSalvar = document.querySelector('#btn-salvar')

        btnSalvar.addEventListener('click', function () {

            document.querySelectorAll('.erro').forEach(el => el.classList.remove('erro'))
            document.querySelectorAll('.mensagem-erro').forEach(el => el.remove())

            let valido = true

            const campos = [
                { id: 'input-empresa', mensagem: 'Nome da empresa é obrigatório' },
                { id: 'input-cnpj', mensagem: 'CNPJ é obrigatório' },
                { id: 'input-email', mensagem: 'Email é obrigatório' },
                { id: 'input-telefone', mensagem: 'Telefone é obrigatório' },
            ]

            campos.forEach(function (campo) {

                const input = document.querySelector('#' + campo.id)

                if (!input.value.trim()) {
                    input.classList.add('erro')
                    const msg = document.createElement('span')
                    msg.classList.add('mensagem-erro')
                    msg.textContent = campo.mensagem
                    input.parentElement.appendChild(msg)
                    valido = false
                }

            })

            if (valido) {
            
                alert('Configurações salvas com sucesso!')
            }

        })

    </script>
</body>

</html>
