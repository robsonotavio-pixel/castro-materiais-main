<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materiais - Castro Materiais</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <img src="img/logo.png" alt="Logo Castro Materiais">
            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>

                <li class="active">
                    <a href="material.html">
                        <i class="fas fa-box"></i> Materiais
                    </a>
                </li>

                <li>
                    <a href="cliente.html">
                        <i class="fas fa-users"></i> Clientes
                    </a>
                </li>

                <li>
                    <a href="pedidos.html">
                        <i class="fas fa-cart-shopping"></i> Pedidos
                    </a>
                </li>

                <li>
                    <a href="pagamentos.html">
                        <i class="fas fa-money-bill"></i> Pagamentos
                    </a>
                </li>

                <li>
                    <a href="relatorios.html">
                        <i class="fas fa-chart-column"></i> Relatórios
                    </a>
                </li>

                <li>
                    <a href="configuracao.html">
                        <i class="fas fa-gear"></i> Configurações
                    </a>
                </li>

                <li>
                    <a href="perfil.html">
                        <i class="fas fa-user"></i> Perfil
                    </a>
                </li>

            </ul>

        </aside>

        <main class="content">

            <div class="top-bar">
                <h1>Materiais</h1>
                <a href="novo-material.html" class="btn-green">
                    <i class="fas fa-plus"></i> Novo Material
                </a>
            </div>

            <div class="search-box">
                <input type="text"  id= "input-busca"  placeholder="Buscar material...">
            </div>

            <div class="table-box">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Material</th>
                            <th>Unidade</th>
                            <th>Preço</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-materiais">
                    </tbody>

                </table>

            </div>

        </main>

    </div>
    <script src="js/api.js"></script>
    <script>

    let materiais = []
    const tabela = document.querySelector('#tabela-materiais')
    const inputBusca = document.querySelector('#input-busca')

    async function carregarMateriais() {
        try {
            materiais = await apiGet('/materiais')
            renderizarTabela(materiais)
        } catch (erro) {
            alert('Erro ao carregar materiais')
        }
    }

    function formatarPreco(preco) {
        return 'R$ ' + Number(preco ?? 0).toFixed(2).replace('.', ',')
    }

    function renderizarTabela(lista) {
        tabela.innerHTML = ''

        lista.forEach(function(material) {
            const linha = document.createElement('tr')
            linha.dataset.id = material.id
            linha.innerHTML = `
                <td>${material.id}</td>
                <td>${material.nome ?? ''}</td>
                <td>${material.unidade ?? ''}</td>
                <td>${formatarPreco(material.preco)}</td>
                <td>
                    <button class="btn-edit" onclick="editarLinha(this)"><i class="fa-solid fa-pen"></i></button>
                    <button class="btn-delete" onclick="excluirMaterial(this)"><i class="fas fa-trash"></i></button>
                </td>
            `
            tabela.appendChild(linha)
        })
    }

    async function excluirMaterial(botao) {
        const linha = botao.closest('tr')
        const id = linha.dataset.id

        const confirmou = confirm('Tem certeza que deseja excluir?')
        if (!confirmou) return

        try {
            await apiDelete('/materiais/' + id)
            linha.remove()
        } catch (erro) {
            alert('Erro ao excluir material')
        }
    }

    inputBusca.addEventListener('keyup', function() {
        const termo = inputBusca.value.toLowerCase()
        const linhas = tabela.querySelectorAll('tr')

        linhas.forEach(function(linha) {
            const texto = linha.textContent.toLowerCase()
            linha.style.display = texto.includes(termo) ? '' : 'none'
        })
    })

    function editarLinha(botao) {

        const linha = botao.closest('tr')
        const celulas = linha.querySelectorAll('td')
        const editando = linha.classList.contains('editando')

        if (!editando) {

            for (let i = 1; i < celulas.length - 1; i++) {
                const valorAtual = celulas[i].textContent.trim()
                celulas[i].innerHTML = `<input type="text" value="${valorAtual}" style="width:100%; padding:6px; border:1px solid #ff6b00; border-radius:6px;">`
            }

            linha.classList.add('editando')
            botao.innerHTML = '<i class="fa-solid fa-check"></i>'
            botao.style.background = '#16a34a'

        } else {

            const id = Number(linha.dataset.id)
            const materialAtual = materiais.find(m => m.id === id)

            const nome = celulas[1].querySelector('input').value
            const unidade = celulas[2].querySelector('input').value
            const preco = parseFloat(celulas[3].querySelector('input').value.replace('R$', '').replace(',', '.').trim()) || 0

            const materialAtualizado = Object.assign({}, materialAtual, { nome, unidade, preco })

            apiPut('/materiais/' + id, materialAtualizado).then(function(salvo) {

                const indice = materiais.findIndex(m => m.id === id)
                materiais[indice] = salvo

                celulas[1].textContent = salvo.nome ?? ''
                celulas[2].textContent = salvo.unidade ?? ''
                celulas[3].textContent = formatarPreco(salvo.preco)

                linha.classList.remove('editando')
                botao.innerHTML = '<i class="fa-solid fa-pen"></i>'
                botao.style.background = ''

                alert('Material atualizado com sucesso!')

            }).catch(function() {
                alert('Erro ao atualizar material')
            })
        }
    }

    carregarMateriais()

</script>


</body>
</html>
