<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Novo Material - Castro Materiais</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <img src="img/logo.png" alt="Logo Castro Materiais">
            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>

                <li class="active">
                    <a href="material.html">
                        <i class="fas fa-box"></i> Materiais
                    </a>
                </li>

                <li>
                    <a href="cliente.html">
                        <i class="fas fa-users"></i> Clientes
                    </a>
                </li>

                <li>
                    <a href="pedidos.html">
                        <i class="fas fa-cart-shopping"></i> Pedidos
                    </a>
                </li>

                <li>
                    <a href="pagamentos.html">
                        <i class="fas fa-money-bill"></i> Pagamentos
                    </a>
                </li>

                <li>
                    <a href="relatorios.html">
                        <i class="fas fa-chart-column"></i> Relatórios
                    </a>
                </li>

                <li>
                    <a href="configuracao.html">
                        <i class="fas fa-gear"></i> Configurações
                    </a>
                </li>

                <li>
                    <a href="perfil.html">
                        <i class="fas fa-user"></i> Perfil
                    </a>
                </li>

            </ul>

        </aside>

        <main class="content">

            <div class="top-bar">
                <h1>Novo Material</h1>
                <a href="material.html" class="btn-cancel">
                    <i class="fas fa-arrow-left"></i> Voltar
                </a>
            </div>

            <div class="form-box">

                <div class="form-group">
                    <label>Nome do Material</label>
                    <input type="text" id="input-nome" placeholder="Ex: Areia">
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label>Unidade de Medida</label>
                        <select id="select-unidade">
                            <option>M³</option>
                            <option>KG</option>
                            <option>UN</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Quantidade em Estoque</label>
                        <input type="number" id="input-quantidade" min="0" step="any" placeholder="Ex: 50">
                    </div>

                </div>

                <div class="form-group">
                    <label>Preço Unitário (R$)</label>
                    <input type="number" id="input-preco" min="0" step="0.01" placeholder="Ex: 180.00">
                </div>

                <div class="buttons">
                    <a href="material.html" class="btn-cancel">Cancelar</a>
                    <button type="button" id="btn-salvar" class="btn-save">
                        <i class="fas fa-check"></i> Salvar Material
                    </button>
                </div>

            </div>

        </main>

    </div>
<script src="js/api.js"></script>
<script>

    const btnSalvar = document.querySelector('#btn-salvar')

    btnSalvar.addEventListener('click', async function(e) {

        e.preventDefault()

        let valido = true

        const campos = [
            { id: 'input-nome',       mensagem: 'Nome do material é obrigatório' },
            { id: 'input-quantidade', mensagem: 'Quantidade é obrigatória' },
            { id: 'input-preco',      mensagem: 'Preço é obrigatório' },
        ]

        document.querySelectorAll('.erro').forEach(el => el.classList.remove('erro'))
        document.querySelectorAll('.mensagem-erro').forEach(el => el.remove())

        campos.forEach(function(campo) {

            const input = document.querySelector('#' + campo.id)

            if (!input.value.trim()) {
                input.classList.add('erro')

                const msg = document.createElement('span')
                msg.classList.add('mensagem-erro')
                msg.textContent = campo.mensagem
                input.parentElement.appendChild(msg)

                valido = false
            }

        })

        if (!valido) return

        const material = {
            nome: document.querySelector('#input-nome').value,
            unidade: document.querySelector('#select-unidade').value,
            estoque: parseInt(document.querySelector('#input-quantidade').value),
            preco: parseFloat(document.querySelector('#input-preco').value)
        }

        try {
            await apiPost('/materiais', material)
            alert('Material salvo com sucesso!')
            window.location.href = 'material.html'
        } catch (erro) {
            alert('Erro ao salvar material')
        }

    })


</script>
</body>

</html>
