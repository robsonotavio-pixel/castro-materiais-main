<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedidos - Castro Materiais</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>

    <div class="container">

        <aside class="sidebar">

            <div class="logo">
                <img src="img/logo.png" alt="Logo Castro Materiais">
            </div>

            <ul>

                <li>
                    <a href="dashboard.html">
                        <i class="fas fa-home"></i> Dashboard
                    </a>
                </li>

                <li>
                    <a href="material.html">
                        <i class="fas fa-box"></i> Materiais
                    </a>
                </li>

                <li>
                    <a href="cliente.html">
                        <i class="fas fa-users"></i> Clientes
                    </a>
                </li>

                <li class="active">
                    <a href="pedidos.html">
                        <i class="fas fa-cart-shopping"></i> Pedidos
                    </a>
                </li>

                <li>
                    <a href="pagamentos.html">
                        <i class="fas fa-money-bill"></i> Pagamentos
                    </a>
                </li>

                <li>
                    <a href="relatorios.html">
                        <i class="fas fa-chart-column"></i> Relatórios
                    </a>
                </li>

                <li>
                    <a href="configuracao.html">
                        <i class="fas fa-gear"></i> Configurações
                    </a>
                </li>

                <li>
                    <a href="perfil.html">
                        <i class="fas fa-user"></i> Perfil
                    </a>
                </li>

            </ul>

        </aside>

        <main class="content">

            <div class="top-bar">
                <h1>Pedidos</h1>
                <a href="novo-pedido.html" class="btn-green">
                    <i class="fas fa-plus"></i> Novo Pedido
                </a>
            </div>

            <div class="search-box">
                <input type="text" id="input-busca" placeholder="Buscar pedido...">
            </div>

            <div class="table-box">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Cliente</th>
                            <th>Data</th>
                            <th>Total</th>
                            <th>Status</th>
                            <th>Ações</th>
                        </tr>
                    </thead>

                    <tbody id="tabela-pedidos">
                    </tbody>

                </table>

            </div>

        </main>

    </div>
    <script src="js/api.js"></script>
    <script>

    const tabela = document.querySelector('#tabela-pedidos')
    const inputBusca = document.querySelector('#input-busca')

    function classeBadge(status) {
        if (status === 'Pago') return 'badge-pago'
        if (status === 'Cancelado') return 'badge-cancelado'
        return 'badge-pendente'
    }

    function formatarPreco(valor) {
        return 'R$ ' + Number(valor ?? 0).toFixed(2).replace('.', ',')
    }

    async function carregarPedidos() {
        try {
            const pedidos = await apiGet('/pedidos')
            renderizarTabela(pedidos)
        } catch (erro) {
            alert('Erro ao carregar pedidos')
        }
    }

    function renderizarTabela(lista) {
        tabela.innerHTML = ''

        lista.forEach(function(pedido) {
            const linha = document.createElement('tr')
            linha.dataset.id = pedido.id
            const status = pedido.status ?? 'Pendente'
            linha.innerHTML = `
                <td>${pedido.id}</td>
                <td>${pedido.cliente ? pedido.cliente.nome : ''}</td>
                <td>${pedido.data ?? ''}</td>
                <td>${formatarPreco(pedido.valorTotal)}</td>
                <td><span class="badge ${classeBadge(status)}">${status}</span></td>
                <td>
                    <button class="btn-delete" onclick="excluirPedido(this)"><i class="fas fa-trash"></i></button>
                </td>
            `
            tabela.appendChild(linha)
        })
    }

    async function excluirPedido(botao) {
        const linha = botao.closest('tr')
        const id = linha.dataset.id

        const confirmou = confirm('Tem certeza que deseja excluir?')
        if (!confirmou) return

        try {
            await apiDelete('/pedidos/' + id)
            linha.remove()
        } catch (erro) {
            alert('Erro ao excluir pedido')
        }
    }

    inputBusca.addEventListener('keyup', function() {
        const termo = inputBusca.value.toLowerCase()
        const linhas = tabela.querySelectorAll('tr')

        linhas.forEach(function(linha) {
            const texto = linha.textContent.toLowerCase()
            linha.style.display = texto.includes(termo) ? '' : 'none'
        })
    })

    carregarPedidos()

</script>

</body>
</html>
